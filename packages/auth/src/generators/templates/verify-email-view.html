<!-- Email layout: tables and inline styles, so it renders the same in
     Gmail, Outlook and Apple Mail. The first link is the action link. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f2f6;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #dedbe6;border-radius:14px;">
        <tr>
          <td style="padding:28px 32px 0;">
            <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#0034ca;transform:skewX(-20deg);"></span>
            <span style="font-size:16px;font-weight:700;letter-spacing:-0.02em;color:#17151c;padding-left:6px;">Tylix</span>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 8px;">
            <h1 style="margin:0 0 8px;font-size:22px;line-height:28px;font-weight:650;color:#17151c;">Verify your email</h1>
            <p style="margin:0 0 24px;font-size:14px;line-height:22px;color:#3d3a47;">Confirm this address to finish setting up your account.</p>
            <a href="{{ verifyUrl }}" style="display:inline-block;padding:11px 20px;background:#0034ca;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:9px;">Verify email</a>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 28px;">
            <p style="margin:0 0 6px;font-size:12px;line-height:18px;color:#6b6878;">Or paste this link into your browser:</p>
            <p style="margin:0;font-size:12px;line-height:18px;word-break:break-all;"><a href="{{ verifyUrl }}" style="color:#0034ca;">{{ verifyUrl }}</a></p>
            <p style="margin:18px 0 0;font-size:12px;line-height:18px;color:#6b6878;">The link expires in 24 hours. If you didn't create an account, you can ignore this email.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
