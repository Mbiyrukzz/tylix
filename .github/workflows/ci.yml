name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  editor:
    name: Editor tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editors/vscode/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: editors/vscode
      # Bundles the extension and the language server, then runs the
      # grammar tests and the LSP protocol test against the bundle.
      - run: npm run build && npm test
        working-directory: editors/vscode
      - run: node --test packages/language-server/src/server.test.js
        env:
          TYLIX_LS_BIN: ${{ github.workspace }}/editors/vscode/dist/server.cjs
      - run: npx vsce package --no-dependencies --out tylix.vsix
        working-directory: editors/vscode
      - run: node scripts/build.mjs
        working-directory: devtools/extension
      - uses: actions/upload-artifact@v4
        with:
          name: editor-extensions
          path: |
            editors/vscode/tylix.vsix
            devtools/extension/tylix-devtools.zip

  compat:
    name: Framework compatibility (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [react, vue, svelte, angular]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/compat-matrix.mjs --only ${{ matrix.adapter }}

  e2e:
    name: E2E (${{ matrix.frontend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        frontend: [react, vue, svelte, angular, tylix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner image ships Google Chrome; the E2E scripts use it through
      # playwright-core.
      - run: node e2e/frontends.mjs --only ${{ matrix.frontend }}
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          TYLIX_E2E_DIR: ${{ runner.temp }}/tylix-e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.frontend }}-logs
          path: ${{ runner.temp }}/tylix-e2e/*.log
